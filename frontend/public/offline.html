<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#D9381E" />
    <title>Offline — SafeCircle</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: #1A1A2E;
        background: linear-gradient(135deg, #FFF1EA, #F5F5F7 55%, #E9E9EE);
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #fff;
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 2px 10px rgba(20,20,40,.08);
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 99px;
        background: #FEF3C7;
        color: #92400E;
        font: 700 12px Inter, sans-serif;
        margin-bottom: 12px;
      }
      h1 { font-size: 24px; font-weight: 800; margin: 0 0 8px; }
      p { font-size: 14px; color: #5B5B6B; line-height: 1.5; margin: 0 0 20px; }
      .actions { display: flex; flex-direction: column; gap: 10px; }
      .sos {
        display: block;
        text-decoration: none;
        padding: 14px 20px;
        border-radius: 14px;
        background: #D92D20;
        color: #fff;
        font-weight: 800;
        font-size: 15px;
      }
      .retry {
        border: 1px solid #D5D5DE;
        background: #fff;
        color: #1A1A2E;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">You are offline</div>
      <h1>SafeCircle cannot reach the server</h1>
      <p>
        Check your mobile data or Wi-Fi connection. If you have an urgent emergency right now, call national emergency services directly.
      </p>
      <div class="actions">
        <a class="sos" href="tel:112">Call 112 Emergency Now</a>
        <button class="retry" onclick="window.location.reload()">Try Reconnecting</button>
      </div>
    </main>
  </body>
</html>
